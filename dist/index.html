<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>REGISTER-UI</title>
    <link rel="stylesheet" href="/dist/styles.css" />
  </head>
  <body
    class="m-0 p-0 w-screen h-screen overflow-hidden bg-gradient-to-br from-gray-800 to-gray-900 relative">
    <!-- Background Grid Circles -->
    <div class="absolute inset-0 grid grid-cols-2 grid-rows-2">
      <!-- Reusable Background Cell -->
      <template id="cell-template">
        <div class="relative flex items-center justify-center">
          <!-- Ripple wheel -->
          <div class="absolute bottom-4 left-4 animate-ripple">
            <div class="w-14 bg-purple-400 rotate-90">
              <div class="w-14 h-1 bg-fuchsia-500 rotate-90">
                <div class="w-14 h-1 bg-blue-500 rotate-45">
                  <div class="w-14 h-1 bg-purple-500 rotate-90"></div>
                </div>
              </div>
            </div>
          </div>
          <!-- Spinning Wheel -->
          <div class="absolute top-20 right-20 animate-spin-slow">
            <div class="w-14 bg-purple-400 rotate-90">
              <div class="w-14 h-1 bg-fuchsia-500 rotate-90">
                <div class="w-14 h-1 bg-blue-500 rotate-45">
                  <div class="w-14 h-1 bg-purple-500 rotate-90"></div>
                </div>
              </div>
            </div>
          </div>
          <!-- Pulsing wheel -->
          <div class="absolute top-20 left-20 animate-pulse-slow">
            <div class="w-14 bg-purple-400 rotate-90">
              <div class="w-14 h-1 bg-fuchsia-500 rotate-90">
                <div class="w-14 h-1 bg-blue-500 rotate-45">
                  <div class="w-14 h-1 bg-purple-500 rotate-90"></div>
                </div>
              </div>
            </div>
          </div>
          <!-- Ripple wheel -->
          <div class="absolute bottom-4 right-4 animate-ripple">
            <div class="w-14 bg-purple-400 rotate-90">
              <div class="w-14 h-1 bg-fuchsia-500 rotate-90">
                <div class="w-14 h-1 bg-blue-500 rotate-45">
                  <div class="w-14 h-1 bg-purple-500 rotate-90"></div>
                </div>
              </div>
            </div>
          </div>
          <!-- Animated Center Circle -->
          <div
            class="relative size-72 rounded-full bg-gradient-to-tr from-indigo-700 to-purple-500 glow animate-pulse-slow flex items-center justify-center">
            <div
              class="size-40 bg-gradient-to-b from-violet-500 to-fuchsia-400 rounded-full shadow-inner translate-x-4 translate-y-2 animate-ripple absolute"></div>
          </div>
        </div>
      </template>
      <script>
        const template = document.getElementById("cell-template");
        for (let i = 0; i < 4; i++) {
          document.body
            .querySelector(".grid")
            .appendChild(template.content.cloneNode(true));
        }
      </script>
    </div>

    <!-- Centered Registration Form -->
    <div
      class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[440px] max-h-96 bg-gradient-to-br from-indigo-900 via-gray-900 to-purple-900 rounded-2xl shadow-2xl z-50 p-6 grid grid-cols-6 gap-y-4">
      <!-- Visual Side -->
      <div
        class="col-span-3 bg-gradient-to-tr from-purple-700 to-fuchsia-600 rounded-l-2xl flex items-center justify-center p-6">
        <h2
          class="text-white text-[1.8rem] font-bold font-playWriteCuba w-full">
          Join Us!
        </h2>
      </div>

      <!-- Form Side -->
      <div class="col-span-3 p-3 flex flex-col font-raleWay">
        <form class="text-gray-200 space-y-2">
          <!-- Name div -->
          <div id="name" class="font-raleWay">
            <label for="name" class="block font-semibold text-sm">Name</label>
            <input
              type="text"
              class="w-full px-2 py-1.5 bg-gray-800 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
          </div>
          <!-- Email div -->
          <div id="email" class="font-raleWay">
            <label for="email" class="block font-semibold text-sm">Email</label>
            <input
              type="email"
              class="w-full px-2 py-1.5 bg-gray-800 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
          </div>
          <!-- Date of Birth -->
          <div id="dOb" class="font-raleWay">
            <label for="dOb" class="block font-semibold text-sm"
              >Date of Birth</label
            >
            <input
              type="date"
              class="w-full px-2 py-1.5 bg-gray-800 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
          </div>
          <!-- Password -->
          <div id="password">
            <label for="password" class="block font-semibold text-sm"
              >Password</label
            >
            <!-- Password and show password -->
            <div class="w-full flex gap-1 h-8">
              <input
                name="password"
                type="password"
                class="w-[60%] px-2 py-1.5 bg-gray-800 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-fuchsia-500" />
              <button
                id="showPass"
                class="w-[40%] active:bg-gradient-to-l px-2 bg-gradient-to-r from-indigo-900 via-gray-900 to-purple-950 rounded-md text-[10px] hover:brightness-110 focus:outline-none">
                Show password
              </button>
            </div>
          </div>
          <div class="flex gap-3 mt-2 font-raleWay font-extralight">
            <button
              type="submit"
              class="w-full py-1 bg-gradient-to-br from-fuchsia-500 via-purple-800 to-pink-400 rounded-md text-sm hover:brightness-110 transition font-normal">
              Sign Up
            </button>
            <button
              type="reset"
              class="w-full py-1.5 bg-gradient-to-br from-indigo-900 via-gray-900 to-purple-950 rounded-md text-sm hover:brightness-110 transition font-normal">
              Reset
            </button>
          </div>
        </form>
      </div>
    </div>
    <script src="/dist/scripts.js"></script>
  </body>
</html>
